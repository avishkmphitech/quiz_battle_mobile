name: quiz_battle
description: Quiz Battle mobile app (REST + clean architecture).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.6.2
  package_info_plus: ^8.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  state_notifier: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/env/.env
    - assets/branding/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/app_logo.png
    background_color: "#0f0f0f"
    theme_color: "#f97316"
  windows:
    generate: true
    image_path: assets/branding/app_logo.png
    icon_size: 256
  image_path: assets/branding/app_logo.png
  min_sdk_android: 21
